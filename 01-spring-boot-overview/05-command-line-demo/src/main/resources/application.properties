spring.application.name=mycoolapp

# Use wildcard "*" to expose all endpoints include=*
# Can also expose individual endpoints with comma-delimited list: include=health,info
management.endpoints.web.exposure.include=*
management.info.env.enabled=true

# Exclude individuals endpoints with a comma-delimited list
# management.endpoints.web.exposure.exclude=health,info

info.app.name=My Super Cool App
info.app.description=A crazy and fun app, yoohoo!
info.app.version=1.0.0